# Builds the web app image for the Pi and pushes it to ghcr; Watchtower on the
# Pi rolls it out (docs/deploy.md).
name: web image

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/web-image.yml
      - .dockerignore
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - scripts/build-web-wasm.sh
      - apple/pkm/Resources/sample.excalidraw
      - apple/pkm/Resources/Fonts/Excalifont-Regular.ttf
      - web/**
  workflow_dispatch:

# A newer push supersedes a build still running.
concurrency:
  group: web-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha
      # The build stages run natively; only the final, copy-only stage is
      # arm64, so no QEMU is needed.
      - uses: docker/build-push-action@v7
        with:
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
