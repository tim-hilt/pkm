# The core as WebAssembly for the web app (ADR-0014): hand-written
# `wasm-bindgen` exports mirroring the UniFFI surface of `crates/bindings`.
# Depends on the core, on the cloud crate without its `native` feature (ADR-0016)
# and on `wasm-bindgen`.
[package]
name = "excalidraw-native-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
excalidraw-native-core = { path = "../core" }
excalidraw-native-cloud = { path = "../cloud", default-features = false }
wasm-bindgen = "0.2"
