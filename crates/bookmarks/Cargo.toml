# The Bookmarks Context: saved web pages, kept as Markdown files.
[package]
name = "pkm-bookmarks"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Front matter, Item IDs, JSON (for JSON-LD), the clock and the file seam.
pkm-base = { path = "../base" }
# Search's matching.
pkm-search = { path = "../search" }
