# Cloud Providers: the storage interface, directory and WebDAV storages and
# the HTTP client (ADR-0012). Copied from Leaf and adapted. Kept out of the
# core, which has no dependencies (ADR-0009).
[package]
name = "excalidraw-native-cloud"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Basic auth.
base64 = "0.22"
# The PROPFIND answers of a WebDAV server.
quick-xml = "0.42"

# TLS: the system's on Apple platforms, rustls elsewhere.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"
ureq = { version = "3.1", default-features = false, features = ["native-tls", "gzip"] }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ureq = { version = "3.1", default-features = false, features = ["rustls", "gzip"] }
