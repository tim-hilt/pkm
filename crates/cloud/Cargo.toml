# Cloud Providers: the storage interface, directory and WebDAV storages and
# the HTTP client (ADR-0012). Copied from Leaf and adapted. Kept out of the
# core, which has no dependencies (ADR-0009).
[package]
name = "pkm-cloud"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The merge of concurrent changes.
pkm-core = { path = "../core" }
# Basic auth.
base64 = "0.22"
# The PROPFIND answers of a WebDAV server.
quick-xml = "0.42"

[features]
# Everything that needs the operating system or a blocking network: the
# directory storage, WebDAV over ureq, iCloud Drive, Google Drive, OneDrive and
# the blocking Sync runners. Without it the crate builds for
# `wasm32-unknown-unknown` (ADR-0016).
default = ["native"]
native = ["dep:ureq", "dep:libc"]

# TLS: the system's on Apple platforms, rustls elsewhere.
[target.'cfg(target_vendor = "apple")'.dependencies]
libc = { version = "0.2", optional = true }
ureq = { version = "3.1", default-features = false, features = ["native-tls", "gzip"], optional = true }

[target.'cfg(not(target_vendor = "apple"))'.dependencies]
ureq = { version = "3.1", default-features = false, features = ["rustls", "gzip"], optional = true }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["native"]
