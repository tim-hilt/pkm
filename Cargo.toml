# Rust core (ADR-0001) and its UniFFI bindings (ADR-0007).
[workspace]
resolver = "3"
members = ["crates/base", "crates/drawing", "crates/cloud", "crates/bindings", "crates/web"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

# Small and fast binaries for the app; the core ships inside it.
[profile.release]
lto = true
codegen-units = 1
strip = true

# The web app's wasm: smallest rather than fastest (ADR-0014). The native apps
# keep `release` above.
[profile.web]
inherits = "release"
opt-level = "z"
