# XcodeGen spec; `make apple-project` generates ExcalidrawNative.xcodeproj from it.
# Edit this file, never the generated project.
name: ExcalidrawNative
options:
  bundleIdPrefix: com.timhilt
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "27.0"
targets:
  # One multiplatform target serves iOS, iPadOS and macOS.
  ExcalidrawNative:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    # Generated/ holds the Rust core's Swift bindings and XCFramework, built by
    # `make core-apple` (which `make apple-project` depends on).
    sources: [ExcalidrawNative, Generated/ExcalidrawNativeCore.swift]
    dependencies:
      - framework: Generated/ExcalidrawNativeCoreFFI.xcframework
        embed: false
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Config/Info.plist
      properties:
        # Drawings live in Documents, which Files (iOS) and Finder show.
        UIFileSharingEnabled: true
        # The `.excalidraw` type, for exporting Drawings.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.excalidraw.drawing
            UTTypeDescription: Excalidraw Drawing
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [excalidraw]
              public.mime-type: [application/vnd.excalidraw+json]
        # Launch screen background follows the appearance: white, or the dark
        # Canvas colour (ADR-0010). The colour lives in Assets.xcassets.
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.timhilt.excalidrawnative
        # The bundle, executable and macOS menu bar show this name; the Swift
        # module keeps its space-free one.
        PRODUCT_NAME: Excalidraw Native
        PRODUCT_MODULE_NAME: ExcalidrawNative
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # User-facing strings live in ExcalidrawNative/Localizable.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        GENERATE_INFOPLIST_FILE: YES
        # Assets.xcassets holds the launch colour and the accent colour (the
        # global accent, Excalidraw's purple); the app has no icon set.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Excalidraw Native
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        # Cloud Backing talks to the user's WebDAV server.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # iCloud Drive is granted through a folder picker and kept as a bookmark.
        ENABLE_USER_SELECTED_FILES: readwrite
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Apple silicon only: smaller binary, no x86_64 slice.
        ARCHS: arm64
        # Ad-hoc sign macOS builds so they run without a development team.
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets: [ExcalidrawNativeTests]
  # Run by `make test-ui` (iOS Simulator); not part of the unit-test scheme.
  ExcalidrawNativeUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [ExcalidrawNativeUITests]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: ExcalidrawNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        TEST_TARGET_NAME: ExcalidrawNative
  ExcalidrawNativeTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [ExcalidrawNativeTests]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: ExcalidrawNative
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        # The app's product name has a space, which the default test host
        # lacks; macOS app bundles keep the executable under Contents/MacOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Excalidraw Native.app/Excalidraw Native"
        BUNDLE_LOADER: "$(TEST_HOST)"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Excalidraw Native.app/Contents/MacOS/Excalidraw Native"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
schemes:
  ExcalidrawNativeUITests:
    build:
      targets:
        ExcalidrawNative: all
    test:
      targets: [ExcalidrawNativeUITests]
