# XcodeGen spec; `make apple-project` generates pkm.xcodeproj from it.
# Edit this file, never the generated project.
name: pkm
options:
  bundleIdPrefix: com.timhilt
  developmentLanguage: en
  deploymentTarget:
    iOS: "26.0"
    macOS: "27.0"
targets:
  # One multiplatform target serves iOS, iPadOS and macOS.
  pkm:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS]
    # Generated/ holds the Rust core's Swift bindings and XCFramework, built by
    # `make core-apple` (which `make apple-project` depends on).
    sources: [pkm, Generated/pkmCore.swift]
    dependencies:
      - framework: Generated/pkmCoreFFI.xcframework
        embed: false
      # The Share extension, embedded in the app.
      - target: pkmShare
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Config/Info.plist
      properties:
        # Drawings live in Documents, which Files (iOS) and Finder show.
        UIFileSharingEnabled: true
        # `pkm://<context>[/<id>]` links open the app.
        CFBundleURLTypes:
          - CFBundleURLName: pkm
            CFBundleURLSchemes: [pkm]
        # The `.excalidraw` type, for exporting Drawings.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: com.excalidraw.drawing
            UTTypeDescription: Excalidraw Drawing
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [excalidraw]
              public.mime-type: [application/vnd.excalidraw+json]
        # Launch screen background follows the appearance: white, or the dark
        # Canvas colour (ADR-0010). The colour lives in Assets.xcassets.
        UILaunchScreen:
          UIColorName: LaunchBackground
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    settings:
      base:
        # APP_BUNDLE_ID (Config/Signing.xcconfig) also names the Share extension.
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        # The bundle, executable and macOS menu bar show this name; the Swift
        # module keeps its space-free one.
        PRODUCT_NAME: pkm
        PRODUCT_MODULE_NAME: pkm
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        # Set from the latest git tag by `make apple-project` (scripts/version.sh).
        MARKETING_VERSION: "${MARKETING_VERSION}"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # User-facing strings live in pkm/Localizable.xcstrings.
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        GENERATE_INFOPLIST_FILE: YES
        # Assets.xcassets holds the launch colour and the accent colour (the
        # global accent, Excalidraw's purple); the app has no icon set.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        INFOPLIST_FILE: Config/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: pkm
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        # Cloud Backing talks to the user's WebDAV server.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        # iCloud Drive is granted through a folder picker and kept as a bookmark.
        ENABLE_USER_SELECTED_FILES: readwrite
        # The App Group, through which the Share extension hands over Bookmarks.
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Config/Mac.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        # Apple silicon only: smaller binary, no x86_64 slice.
        ARCHS: arm64
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          DEAD_CODE_STRIPPING: YES
    scheme:
      testTargets: [pkmTests]
  # Saves the page of Safari's Share sheet (or the URL of another app) as a Bookmark. It
  # shares the app's Bookmarks code and the core, and Saves into the App Group, from which the
  # app takes the Bookmarks in; it must stay small, as an extension has little memory.
  pkmShare:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources:
      - pkmShare
      - Generated/pkmCore.swift
      - pkm/Localizable.xcstrings
      - pkm/Bookmarks/BookmarksModel.swift
      - pkm/Bookmarks/PageDownloader.swift
      - pkm/Bookmarks/SaveSheet.swift
      - pkm/Bookmarks/SharedPage.swift
      - pkm/Bookmarks/ShareHandoff.swift
      - pkm/Tasks/MarkdownImages.swift
    dependencies:
      - framework: Generated/pkmCoreFFI.xcframework
        embed: false
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    info:
      path: Config/ShareInfo.plist
      properties:
        CFBundleDisplayName: pkm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Safari runs the script in the page and hands over its results; other apps share a URL.
            NSExtensionJavaScriptPreprocessingFile: ShareExtension
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).share
        PRODUCT_NAME: pkmShare
        PRODUCT_MODULE_NAME: pkmShare
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        MARKETING_VERSION: "${MARKETING_VERSION}"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        STRING_CATALOG_GENERATE_SYMBOLS: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Config/ShareInfo.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_APP_SANDBOX: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        CODE_SIGN_ENTITLEMENTS: Config/App.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
        ARCHS: arm64
      configs:
        Release:
          SWIFT_OPTIMIZATION_LEVEL: -Osize
          DEAD_CODE_STRIPPING: YES
  # Run by `make test-ui` (iOS Simulator); not part of the unit-test scheme.
  pkmUITests:
    type: bundle.ui-testing
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [pkmUITests]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: pkm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        TEST_TARGET_NAME: pkm
  pkmTests:
    type: bundle.unit-test
    platform: auto
    supportedDestinations: [iOS, macOS]
    sources: [pkmTests]
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    dependencies:
      - target: pkm
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        ARCHS: arm64
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: $(inherited)
        # The app's product name has a space, which the default test host
        # lacks; macOS app bundles keep the executable under Contents/MacOS.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/pkm.app/pkm"
        BUNDLE_LOADER: "$(TEST_HOST)"
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/pkm.app/Contents/MacOS/pkm"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
schemes:
  pkmUITests:
    build:
      targets:
        pkm: all
    test:
      targets: [pkmUITests]
