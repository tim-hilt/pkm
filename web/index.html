<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Excalidraw Native</title>
    <style>
      html,
      body,
      #app,
      canvas {
        margin: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
      }
      canvas {
        /* The browser never interferes with the Canvas: no page zoom,
           double-tap zoom, panning, selection or callout. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* The chrome's colours (Swift's `Chrome`), light like the Canvas until the
         Appearance setting brings Dark mode to both. */
      :root {
        --control-fill: #ececf4;
        --control-ink: #1b1b1f;
        --island-fill: #ffffff;
        --checked-fill: #e0dfff;
        --checked-ink: #030064;
        --divider: #f1f0ff;
      }
      #app {
        position: relative;
      }
      /* Excalidraw's bottom-left controls; 16px margins as in DrawingLayout. */
      .bottom-left {
        position: absolute;
        left: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
      }
      .zoom-controls,
      .undo-redo-controls {
        display: flex;
        background: var(--control-fill);
        border-radius: 8px;
        user-select: none;
        -webkit-user-select: none;
      }
      /* The toolbar island, top centre. */
      .toolbar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--island-fill);
        border-radius: 8px;
        box-shadow: 0 0 3px rgb(0 0 0 / 0.2);
        user-select: none;
        -webkit-user-select: none;
      }
      .toolbar button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
        position: relative;
      }
      .toolbar button::after {
        content: "";
        position: absolute;
        inset: -4px;
      }
      .toolbar button.checked {
        background: var(--checked-fill);
        color: var(--checked-ink);
      }
      .toolbar-divider {
        width: 1px;
        height: 24px;
        margin: 0 4px;
        background: var(--divider);
      }
      button:focus-visible {
        outline: 2px solid #6965db;
        outline-offset: 1px;
      }
      .undo-redo-controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }
      .undo-redo-controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .zoom-controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--control-ink);
        font: inherit;
        font-size: 1.1rem;
        cursor: pointer;
        touch-action: manipulation;
        position: relative;
      }
      /* Touch targets of 44px. */
      .zoom-controls button::after {
        content: "";
        position: absolute;
        inset: -4px 0;
      }
      .zoom-controls .zoom-percent {
        width: 60px;
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      .unsupported {
        max-width: 32rem;
        margin: 20vh auto 0;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
