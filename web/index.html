<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Excalidraw Native</title>
    <style>
      html,
      body,
      #app,
      canvas {
        margin: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
      }
      canvas {
        /* The browser never interferes with the Canvas: no page zoom,
           double-tap zoom, panning, selection or callout. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      /* The chrome's colours (Swift's `Chrome`) are custom properties set on
         the root by ChromeColors, for Light or Dark mode. */
      #app {
        position: relative;
      }
      /* The Text view (TextEditorOverlay): the box of the text, nothing else.
         Placement and look come from the core, inline. */
      .text-view {
        position: absolute;
        box-sizing: border-box;
        margin: 0;
        border: 0;
        outline: none;
        background: transparent;
        resize: none;
        overflow: hidden;
        transform-origin: center;
        /* No double-tap zoom; nor does the page zoom in on focusing it, whatever
           its font size: the viewport's maximum scale is 1. */
        touch-action: manipulation;
      }
      /* Excalidraw's bottom-left controls; 16px margins as in DrawingLayout. */
      .bottom-left {
        position: absolute;
        left: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        gap: 8px;
      }
      .zoom-controls,
      .undo-redo-controls {
        display: flex;
        background: var(--control-fill);
        border-radius: 8px;
        user-select: none;
        -webkit-user-select: none;
      }
      /* The toolbar island, top centre. */
      .toolbar {
        position: absolute;
        top: 16px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 4px;
        background: var(--island-fill);
        border-radius: 8px;
        box-shadow: 0 0 3px rgb(0 0 0 / 0.2);
        user-select: none;
        -webkit-user-select: none;
      }
      .toolbar button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: none;
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
        position: relative;
      }
      .toolbar button::after {
        content: "";
        position: absolute;
        inset: -4px;
      }
      .toolbar button.checked {
        background: var(--checked-fill);
        color: var(--checked-ink);
      }
      .toolbar-divider {
        width: 1px;
        height: 24px;
        margin: 0 4px;
        background: var(--divider);
      }
      button:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .undo-redo-controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }
      .undo-redo-controls button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .zoom-controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--control-ink);
        font: inherit;
        font-size: 1.1rem;
        cursor: pointer;
        touch-action: manipulation;
        position: relative;
      }
      /* Touch targets of 44px. */
      .zoom-controls button::after {
        content: "";
        position: absolute;
        inset: -4px 0;
      }
      .zoom-controls .zoom-percent {
        width: 60px;
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      /* The way back from a Drawing, beside the main menu. */
      .back-to-gallery {
        position: absolute;
        top: 16px;
        right: 60px;
        height: 36px;
        padding: 0 12px;
        border: 0;
        border-radius: 8px;
        background: var(--island-fill);
        color: var(--control-ink);
        font: inherit;
        box-shadow: 0 0 3px rgb(0 0 0 / 0.2);
        cursor: pointer;
        touch-action: manipulation;
      }
      /* The Gallery: a grid of cards, last modified first. */
      .gallery {
        position: absolute;
        inset: 0;
        overflow-y: auto;
        padding: 16px 16px 96px;
        color: var(--control-ink);
        background: var(--island-fill);
        overscroll-behavior: contain;
      }
      .gallery-title {
        margin: 8px 0 16px;
        font-size: 1.5rem;
      }
      .gallery-grid {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 16px;
      }
      .gallery-card {
        position: relative;
        max-width: 260px;
      }
      .gallery-open {
        display: block;
        width: 100%;
        padding: 0;
        border: 0;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
      }
      .gallery-thumb {
        display: flex;
        align-items: center;
        justify-content: center;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border-radius: 12px;
        border: 1px solid var(--divider);
        background: var(--control-fill);
        font-size: 0.8rem;
      }
      .gallery-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .gallery-thumb.unreadable::after {
        content: attr(data-message);
      }
      .gallery-name {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        margin-top: 6px;
        font-size: 0.9rem;
        overflow-wrap: anywhere;
      }
      .gallery-date {
        display: block;
        font-size: 0.75rem;
        opacity: 0.65;
      }
      .gallery-more {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 22px;
        background: transparent;
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }
      .gallery-more svg {
        padding: 4px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--island-fill) 85%, transparent);
      }
      .gallery-menu {
        position: absolute;
        top: 48px;
        right: 4px;
        z-index: 2;
        min-width: 140px;
        padding: 4px;
        display: flex;
        flex-direction: column;
        border-radius: 8px;
        background: var(--island-fill);
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.25);
      }
      .gallery-menu[hidden] {
        display: none;
      }
      .gallery-menu-item {
        min-height: 44px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: var(--control-ink);
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .gallery-menu-item:hover {
        background: var(--control-fill);
      }
      .gallery-menu-item.danger {
        color: #c92a2a;
      }
      .gallery-new {
        position: fixed;
        right: max(20px, env(safe-area-inset-right));
        bottom: max(20px, env(safe-area-inset-bottom));
        width: 56px;
        height: 56px;
        padding: 0;
        border: 0;
        border-radius: 28px;
        background: var(--accent);
        color: var(--accent-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 2px 8px rgb(0 0 0 / 0.3);
        cursor: pointer;
        touch-action: manipulation;
      }
      .gallery.dropping {
        outline: 3px dashed var(--accent);
        outline-offset: -8px;
      }
      .gallery-import {
        position: fixed;
        right: max(88px, calc(env(safe-area-inset-right) + 68px));
        bottom: max(28px, calc(env(safe-area-inset-bottom) + 8px));
        width: 40px;
        height: 40px;
        padding: 0;
        border: 0;
        border-radius: 20px;
        background: var(--island-fill);
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 3px rgb(0 0 0 / 0.3);
        cursor: pointer;
        touch-action: manipulation;
      }
      [hidden] {
        display: none !important;
      }
      /* The phone layout (DrawingLayout's phoneQuery, the same rule as
         layoutFor): the bottom bar in place of the top toolbar and the
         Properties panel, no zoom buttons (pinch) and undo and redo at the
         top left. */
      .phone-chrome {
        display: none;
        position: absolute;
        inset: 0;
        pointer-events: none;
        color: var(--control-ink);
      }
      @media (max-width: 599px), (max-height: 499px) and (max-width: 999px) {
        .phone-chrome {
          display: block;
        }
        .toolbar,
        .properties-panel,
        .zoom-controls {
          display: none;
        }
        .bottom-left {
          bottom: auto;
          top: max(16px, env(safe-area-inset-top));
        }
      }
      .phone-chrome > * {
        pointer-events: auto;
      }
      .bottom-bar {
        position: absolute;
        left: 50%;
        bottom: max(10px, env(safe-area-inset-bottom));
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .action-row {
        display: flex;
        gap: 6px;
        min-height: 43px;
        align-items: center;
        pointer-events: none;
      }
      .action-row > * {
        pointer-events: auto;
      }
      .mobile-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px;
        background: var(--island-fill);
        border-radius: 8px;
        box-shadow: 0 0 3px rgb(0 0 0 / 0.2);
        user-select: none;
        -webkit-user-select: none;
      }
      .mobile-toolbar button,
      .family-picker button {
        position: relative;
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }
      .mobile-toolbar button.checked,
      .family-picker button.checked {
        background: var(--checked-fill);
        color: var(--checked-ink);
      }
      .row-button {
        position: relative;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: var(--island-fill);
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 3px rgb(0 0 0 / 0.2);
        cursor: pointer;
        touch-action: manipulation;
      }
      .row-button::after,
      .mobile-toolbar button::after {
        content: "";
        position: absolute;
        inset: -6px;
      }
      .row-button.checked {
        background: var(--checked-fill);
        color: var(--checked-ink);
      }
      .row-swatch {
        border-radius: 5px;
        background: var(--swatch);
        box-shadow: inset 0 0 0 1px var(--divider);
        color: #fff;
      }
      /* The stroke swatch's hatch glyph reads on any colour. */
      .row-swatch svg {
        mix-blend-mode: difference;
      }
      .row-swatch.checked {
        background: var(--swatch);
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      .row-swatch.transparent {
        background:
          conic-gradient(
              rgb(128 128 128 / 0.35) 25%,
              transparent 0 50%,
              rgb(128 128 128 / 0.35) 0 75%,
              transparent 0
            )
            0 0 / 50% 50%,
          var(--swatch);
      }
      .popover-scrim {
        position: absolute;
        inset: 0;
        touch-action: none;
      }
      /* The phone's popover: an island with a pointer tip toward its anchor. */
      .phone-popover {
        position: absolute;
        box-sizing: border-box;
        width: max-content;
        background: var(--island-fill);
        border-radius: 8px;
        box-shadow:
          0 0 0.5px rgb(0 0 0 / 0.17),
          0 0 1.5px rgb(0 0 0 / 0.08),
          0 7px 7px rgb(0 0 0 / 0.05);
        user-select: none;
        -webkit-user-select: none;
      }
      .popover-content {
        box-sizing: border-box;
        max-height: 100%;
        height: 100%;
        padding: 12px;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .popover-tip {
        position: absolute;
        top: 100%;
        width: 14px;
        height: 7px;
        margin-left: -7px;
        background: var(--island-fill);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
      }
      .popover-sections {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .family-picker {
        display: flex;
        gap: 4px;
      }
      /* The Properties panel, on the left (placed by DrawingLayout). */
      .properties-panel {
        position: absolute;
        box-sizing: border-box;
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        overflow-y: auto;
        overscroll-behavior: contain;
        background: var(--island-fill);
        color: var(--control-ink);
        border-radius: 8px;
        box-shadow:
          0 0 0.5px rgb(0 0 0 / 0.17),
          0 7px 7px rgb(0 0 0 / 0.05);
        user-select: none;
        -webkit-user-select: none;
      }
      .properties-panel[hidden],
      .panel-section[hidden],
      .color-full[hidden],
      .hex-invalid[hidden] {
        display: none;
      }
      .panel-section {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .panel-caption {
        font-size: 0.75rem;
        opacity: 0.65;
      }
      .panel-ends {
        display: flex;
        justify-content: space-between;
      }
      .icon-row,
      .color-row {
        display: flex;
        align-items: center;
      }
      .icon-row {
        gap: 8px;
      }
      .icon-button {
        position: relative;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: rgb(128 128 128 / 0.1);
        color: inherit;
        font: inherit;
        font-size: 13px;
        font-weight: 500;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }
      .icon-button::after {
        content: "";
        position: absolute;
        inset: -6px;
      }
      .icon-button.selected {
        background: var(--checked-fill);
        color: var(--checked-ink);
      }
      .properties-panel input[type="range"] {
        width: 100%;
        margin: 0;
      }
      .color-picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .color-divider {
        width: 1px;
        height: 22px;
        margin: 0 4px;
        background: var(--divider);
      }
      .swatch,
      .color-more {
        flex: 1;
        min-height: 36px;
        min-width: 30px;
        padding: 0;
        border: 0;
        background: none;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }
      .swatch::before,
      .color-more::before {
        content: "";
        box-sizing: border-box;
        width: var(--size);
        height: var(--size);
        border-radius: calc(var(--size) * 0.2);
        background: var(--swatch);
        box-shadow: inset 0 0 0 1px rgb(0 0 0 / 0.1);
      }
      .swatch.transparent::before,
      .color-more.transparent::before {
        background:
          conic-gradient(
              rgb(128 128 128 / 0.35) 25%,
              transparent 0 50%,
              rgb(128 128 128 / 0.35) 0 75%,
              transparent 0
            )
            0 0 / 66% 66%,
          var(--swatch);
      }
      .swatch.selected::before,
      .color-more.open::before {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .color-more {
        flex: none;
        --size: 26px;
      }
      .color-full {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 10px;
        border-radius: 8px;
        background: var(--picker-panel);
      }
      .hex-field {
        display: flex;
        align-items: center;
        gap: 2px;
        min-height: 36px;
        padding: 0 8px;
        border: 1px solid var(--input-border);
        border-radius: 8px;
        background: var(--input-fill);
      }
      .hex-field input {
        flex: 1;
        min-width: 0;
        border: 0;
        outline: 0;
        background: none;
        color: inherit;
        font: inherit;
      }
      .hex-invalid {
        font-size: 0.75rem;
        color: #e03131;
      }
      /* The main menu, top right. */
      .main-menu {
        position: absolute;
        top: 16px;
        right: 16px;
      }
      .main-menu-button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        border-radius: 8px;
        background: var(--island-fill);
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 3px rgb(0 0 0 / 0.2);
        cursor: pointer;
        touch-action: manipulation;
        position: relative;
      }
      .main-menu-button::after {
        content: "";
        position: absolute;
        inset: -4px;
      }
      .main-menu-items {
        position: absolute;
        top: 44px;
        right: 0;
        min-width: 220px;
        padding: 4px;
        border-radius: 8px;
        background: var(--island-fill);
        color: var(--control-ink);
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.3);
      }
      .main-menu-items[hidden] {
        display: none;
      }
      .main-menu-item {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
      }
      .main-menu-item:hover:not(:disabled),
      .main-menu-item:focus-visible {
        background: rgb(128 128 128 / 0.2);
      }
      .main-menu-item:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .main-menu-item[role="menuitemcheckbox"]::before {
        content: "";
        display: inline-block;
        width: 1.4em;
      }
      .main-menu-item[aria-checked="true"]::before {
        content: "✓";
      }
      .main-menu-heading {
        padding: 8px 12px 2px;
        font-size: 0.75rem;
        opacity: 0.6;
      }
      /* The Context menu, over the Canvas where it was opened. */
      .context-menu {
        position: fixed;
        z-index: 10;
        min-width: 200px;
        padding: 4px;
        border-radius: 8px;
        background: var(--island-fill);
        color: var(--control-ink);
        box-shadow: 0 2px 10px rgb(0 0 0 / 0.3);
        outline: none;
        -webkit-touch-callout: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .context-menu[hidden],
      .context-menu-sub[hidden] {
        display: none;
      }
      .context-menu-sub {
        padding-left: 12px;
      }
      .context-menu-item {
        display: block;
        width: 100%;
        min-height: 44px;
        padding: 0 12px;
        border: 0;
        border-radius: 6px;
        background: none;
        color: inherit;
        font: inherit;
        text-align: left;
        cursor: pointer;
        touch-action: manipulation;
      }
      .context-menu-item:hover:not(:disabled),
      .context-menu-item:focus-visible {
        background: rgb(128 128 128 / 0.2);
      }
      .context-menu-item:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .context-menu-item.danger {
        color: #c92a2a;
      }
      .context-menu-item[aria-haspopup]::after {
        content: "›";
        float: right;
      }
      .context-menu-item[aria-expanded="true"]::after {
        content: "⌄";
      }
      .gallery-empty {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        pointer-events: none;
        opacity: 0.7;
      }
      .gallery-empty[hidden] {
        display: none;
      }
      .gallery-dialog {
        max-width: min(24rem, calc(100vw - 32px));
        border: 0;
        border-radius: 12px;
        padding: 16px;
        color: var(--control-ink);
        background: var(--island-fill);
        box-shadow: 0 4px 24px rgb(0 0 0 / 0.35);
      }
      .gallery-dialog h2 {
        margin: 0 0 12px;
        font-size: 1.1rem;
      }
      .gallery-dialog input {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        border: 1px solid var(--input-border);
        border-radius: 6px;
        background: var(--input-fill);
        color: inherit;
        font: inherit;
      }
      .gallery-dialog-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }
      .gallery-dialog-buttons button {
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        background: var(--control-fill);
        color: var(--control-ink);
        font: inherit;
        cursor: pointer;
      }
      .gallery-dialog-buttons .primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .gallery-dialog-buttons .primary.danger {
        background: #c92a2a;
      }
      /* The gear of the Gallery, and the Settings it opens. */
      .gallery-settings {
        position: absolute;
        top: 16px;
        right: 16px;
        width: 44px;
        height: 44px;
        padding: 0;
        border: 0;
        border-radius: 22px;
        background: none;
        color: var(--control-ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        touch-action: manipulation;
      }
      .settings-dialog fieldset {
        margin: 0;
        padding: 0;
        border: 0;
      }
      .settings-dialog legend {
        padding: 0;
        margin-bottom: 8px;
        font-weight: 600;
      }
      .appearance-choices {
        display: flex;
        gap: 4px;
        padding: 4px;
        border-radius: 8px;
        background: var(--control-fill);
      }
      .appearance-choices label {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 6px;
        cursor: pointer;
      }
      .appearance-choices label:has(input:checked) {
        background: var(--checked-fill);
        color: var(--checked-ink);
      }
      .appearance-choices label:has(input:focus-visible) {
        outline: 2px solid var(--accent);
      }
      .appearance-choices input {
        width: auto;
        padding: 0;
        position: absolute;
        opacity: 0;
        pointer-events: none;
      }
      .unsupported {

        padding: 0 1rem;
      }
    </style>
