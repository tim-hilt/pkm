<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Excalidraw Native</title>
    <style>
      html,
      body,
      #app,
      canvas {
        margin: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
        font-family: system-ui, sans-serif;
      }
      canvas {
        /* The browser never interferes with the Canvas: no page zoom,
           double-tap zoom, panning, selection or callout. */
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        overscroll-behavior: none;
      }
      :root {
        --control-fill: #ececf4;
        --control-ink: #1b1b1f;
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --control-fill: #232329;
          --control-ink: #e3e3e8;
        }
      }
      #app {
        position: relative;
      }
      /* Excalidraw's grey bottom-left button group; 16px margins as in
         DrawingLayout. */
      .zoom-controls {
        position: absolute;
        left: 16px;
        bottom: max(16px, env(safe-area-inset-bottom));
        display: flex;
        background: var(--control-fill);
        border-radius: 8px;
        user-select: none;
        -webkit-user-select: none;
      }
      .zoom-controls button {
        width: 36px;
        height: 36px;
        padding: 0;
        border: 0;
        background: none;
        color: var(--control-ink);
        font: inherit;
        font-size: 1.1rem;
        cursor: pointer;
        touch-action: manipulation;
        position: relative;
      }
      /* Touch targets of 44px. */
      .zoom-controls button::after {
        content: "";
        position: absolute;
        inset: -4px 0;
      }
      .zoom-controls .zoom-percent {
        width: 60px;
        font-size: 0.9rem;
        font-variant-numeric: tabular-nums;
      }
      .unsupported {
        max-width: 32rem;
        margin: 20vh auto 0;
        padding: 0 1rem;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
