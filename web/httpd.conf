# BusyBox httpd's MIME types beyond its defaults: the wasm must be
# application/wasm for streaming compilation.
.wasm:application/wasm
.webmanifest:application/manifest+json
.ttf:font/ttf
.excalidraw:application/json
# A deep link (/drawings) has no file: the app answers it, with status 404, and
# routes by the path itself (see ADR-0018).
E404:index.html
