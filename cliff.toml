# Release version and notes come from commit prefixes (AGENTS.md).
# Preview: make release-notes

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
commit_parsers = [
  { message = "^feature", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^chore", group = "Chores" },
]

[bump]
initial_tag = "v0.1.0"
# "feature" is not Conventional Commits' "feat", so name it: features bump
# minor, fixes and chores patch; "!" bumps major (minor before 1.0).
custom_minor_increment_regex = "^feature(\\(.*\\))?:"

[changelog]
header = "# Changelog\n"
body = """
## {{ version | default(value="Unreleased") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits -%}
- {{ commit.message | trim }}{% if commit.breaking %} (breaking){% endif %}
{% endfor %}
{% endfor %}
"""
trim = true
